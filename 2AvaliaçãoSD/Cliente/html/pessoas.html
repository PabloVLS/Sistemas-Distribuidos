<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Pessoas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pessoas.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="bi bi-people"></i>
                <span>Sistema de Pessoa</span>
            </div>
            <div class="nav-links">
                <a href="pessoas.html" class="nav-link active">
                    <i class="bi bi-people"></i>
                </a>
                <a href="veiculos.html" class="nav-link">
                    <i class="bi bi-car-front"></i>
                </a>
                <a href="relatorio.html" class="nav-link">
                    <i class="bi bi-graph-up"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Pessoas</h1>
            <p class="page-subtitle">Cadastro de pessoas</p>
        </div>

        <div class="form-section">
            <form id="formPessoa" class="compact-form">
                <div class="form-row">
                    <div class="input-group">
                        <input type="text" id="nome" placeholder="Nome completo" required>
                    </div>
                    <div class="input-group">
                        <input type="text" id="cpf" placeholder="CPF" required>
                    </div>
                    <button type="submit" class="submit-btn">
                        <i class="bi bi-plus-lg"></i>
                        Adicionar
                    </button>
                </div>
            </form>
        </div>

        <div class="list-section">
            <div class="list-header">
                <span class="list-title">Pessoas Cadastradas</span>
                <span class="list-count" id="contadorPessoas">0</span>
            </div>

            <div class="people-list" id="listaPessoas">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <span>Carregando pessoas...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Editar Pessoa -->
    <div class="modal" id="modalEditarPessoa">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Pessoa</h3>
                <button class="close-btn" onclick="fecharModalPessoa()">
                    <i class="bi bi-x"></i>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="idPessoaEditar">
                <div class="modal-inputs">
                    <input type="text" id="nomeEditar" placeholder="Nome" required>
                    <input type="text" id="cpfEditar" placeholder="CPF" required>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="fecharModalPessoa()">Cancelar</button>
                <button class="btn-primary" onclick="salvarEdicaoPessoa()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal Vincular Veículo -->
    <div class="modal" id="modalVincular">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Vincular Veículo</h3>
                <button class="close-btn" onclick="fecharModalVinculo()">
                    <i class="bi bi-x"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="vinculo-info">
                    <p>Pessoa: <strong id="nomePessoaVinculo"></strong></p>
                </div>
                <div class="modal-inputs">
                    <select id="selectVeiculo" class="modal-select">
                        <option value="">Selecione um veículo</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="fecharModalVinculo()">Cancelar</button>
                <button class="btn-primary" onclick="confirmarVinculo()">Vincular</button>
            </div>
        </div>
    </div>

    <script src="../js/pessoas.js"></script>
</body>
</html>
