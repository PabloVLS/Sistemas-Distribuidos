<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cadastro de Veículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        table {
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            vertical-align: middle;
        }

        #statusMessage {
            margin-top: 12px;
            min-height: 24px;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h2 class="mt-3">Cadastro de Veículos</h2>

        <form id="veiculoForm" class="row g-3 mt-2" onsubmit="event.preventDefault(); salvar();">
            <input type="hidden" id="idveiculo">
            <div class="col-md-6">
                <label for="txtNome" class="form-label">Nome do Veículo</label>
                <input type="text" class="form-control" id="txtNome" required>
            </div>

            <div class="col-md-6">
                <label for="txtMarca" class="form-label">Marca</label>
                <input type="text" class="form-control" id="txtMarca" required>
            </div>

            <div class="col-md-6">
                <label for="txtModelo" class="form-label">Modelo</label>
                <input type="text" class="form-control" id="txtModelo" required>
            </div>

            <div class="col-md-3">
                <label for="txtAno" class="form-label">Ano</label>
                <input type="number" class="form-control" id="txtAno" min="1886" max="2100" required>
            </div>

            <div class="col-md-3 d-flex align-items-end gap-2">
                <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar</button>
                <button type="button" class="btn btn-secondary" id="btnLimpar"
                    onclick="limparFormulario()">Limpar</button>
                <button type="button" class="btn btn-info" id="btnListar" onclick="consultar()">Listar</button>
            </div>
        </form>

        <div id="statusMessage" aria-live="polite"></div>

        <div id="conteudo" class="mt-4"></div>
    </div>

    <script>
        const API = 'http://localhost:8082/api/veiculos';
        // cache local para permitir preencher formulário a partir do id (usado no innerHTML)
        const veiculosCache = {};

        document.addEventListener('DOMContentLoaded', () => {
            consultar();
        });

        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/\//g, '&#x2F;');
        }

        function setStatus(msg = '', type = 'info') {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = (type === 'error') ? 'text-danger' : (type === 'success') ? 'text-success' : 'text-muted';
        }

        function limparFormulario() {
            document.getElementById('idveiculo').value = '';
            document.getElementById('veiculoForm').reset();
            document.getElementById('btnSalvar').textContent = 'Salvar';
            setStatus('');
        }

        async function salvar() {
            setStatus('Enviando...', 'info');
            const id = document.getElementById('idveiculo').value;
            const nome = document.getElementById('txtNome').value.trim();
            const marca = document.getElementById('txtMarca').value.trim();
            const modelo = document.getElementById('txtModelo').value.trim();
            const anoValue = document.getElementById('txtAno').value;

            if (!nome || !marca || !modelo || !anoValue) {
                alert('Por favor, preencha todos os campos.');
                return;
            }

            const ano = parseInt(anoValue, 10);
            if (isNaN(ano) || ano < 1886 || ano > 2100) {
                alert('Ano inválido. Informe um número entre 1886 e 2100.');
                return;
            }

            const veiculo = { nome, marca, modelo, ano };

            try {
                let response;
                if (id) {
                    response = await fetch(`${API}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(veiculo)
                    });
                } else {
                    response = await fetch(API, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(veiculo)
                    });
                }

                const contentType = response.headers.get('Content-Type') || '';
                let body = null;
                if (contentType.includes('application/json')) body = await response.json();
                else body = await response.text();

                if (response.ok) {
                    setStatus(id ? 'Veículo atualizado com sucesso.' : 'Veículo salvo com sucesso.', 'success');
                    limparFormulario();
                    consultar();
                } else {
                    if (body && typeof body === 'object') {
                        const msgs = [];
                        if (body.error) msgs.push(body.error);
                        else {
                            for (const k in body) msgs.push(k + ': ' + body[k]);
                        }
                        alert('Erro: ' + msgs.join('\n'));
                        setStatus('Erro ao salvar veículo.', 'error');
                    } else {
                        alert('Erro ao salvar veículo: ' + (response.statusText || body));
                        setStatus('Erro ao salvar veículo.', 'error');
                    }
                }
            } catch (err) {
                console.error(err);
                alert('Erro de rede: ' + err.message);
                setStatus('Erro de rede ao salvar.', 'error');
            }
        }

        async function consultar() {
            setStatus('Carregando lista...', 'info');
            try {
                const res = await fetch(API);
                if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + res.statusText);
                const veiculos = await res.json();
                montarTabelaInnerHTML(veiculos);
                setStatus('Lista carregada.', 'info');
            } catch (err) {
                console.error(err);
                setStatus('Erro ao carregar lista: ' + err.message, 'error');
            }
        }

        // monta tabela com innerHTML (usando escapeHtml)
        function montarTabelaInnerHTML(veiculos) {
            const container = document.getElementById('conteudo');
            if (!Array.isArray(veiculos) || veiculos.length === 0) {
                container.innerHTML = '<p>Nenhum veículo encontrado.</p>';
                return;
            }

            // atualizar cache
            veiculos.forEach(v => {
                const id = v.idveiculo ?? v.id;
                if (id !== undefined && id !== null) veiculosCache[id] = v;
            });

            let out = '';
            out += '<table class="table table-striped table-bordered">';
            out += '<thead><tr>';
            out += '<th scope="col">ID</th>';
            out += '<th scope="col">Nome</th>';
            out += '<th scope="col">Marca</th>';
            out += '<th scope="col">Modelo</th>';
            out += '<th scope="col">Ano</th>';
            out += '<th scope="col">Ações</th>';
            out += '</tr></thead>';
            out += '<tbody>';

            for (let i = 0; i < veiculos.length; i++) {
                const v = veiculos[i];
                const id = v.idveiculo ?? v.id ?? '';
                out += '<tr>';
                out += '<td>' + escapeHtml(id) + '</td>';
                out += '<td>' + escapeHtml(v.nome) + '</td>';
                out += '<td>' + escapeHtml(v.marca) + '</td>';
                out += '<td>' + escapeHtml(v.modelo) + '</td>';
                out += '<td>' + escapeHtml(v.ano) + '</td>';
                // ações: chamam funções globais passando o id
                out += '<td>';
                out += '<button type="button" class="btn btn-sm btn-outline-success me-2" onclick="preencherParaEdicao(\'' + escapeHtml(id) + '\')">Editar</button>';
                out += '<button type="button" class="btn btn-sm btn-outline-danger" onclick="excluirVeiculo(\'' + escapeHtml(id) + '\')">Excluir</button>';
                out += '</td>';
                out += '</tr>';
            }

            out += '</tbody></table>';
            container.innerHTML = out;
        }

        // preenche o form para edição a partir do cache
        function preencherParaEdicao(id) {
            const v = veiculosCache[id];
            if (!v) {
                alert('Veículo não encontrado no cache. Clique em Listar para atualizar.');
                return;
            }
            document.getElementById('idveiculo').value = id;
            document.getElementById('txtNome').value = v.nome ?? '';
            document.getElementById('txtMarca').value = v.marca ?? '';
            document.getElementById('txtModelo').value = v.modelo ?? '';
            document.getElementById('txtAno').value = v.ano ?? '';
            document.getElementById('btnSalvar').textContent = 'Atualizar';
            setStatus('Modo edição: altere os campos e clique em Atualizar', 'info');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function excluirVeiculo(id) {
            if (!id) { alert('ID inválido para exclusão.'); return; }
            if (!confirm('Confirma exclusão do veículo ID ' + id + '?')) return;

            try {
                const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    setStatus('Veículo excluído.', 'success');
                    // remover do cache
                    delete veiculosCache[id];
                    consultar();
                } else {
                    const ct = res.headers.get('Content-Type') || '';
                    let body = '';
                    if (ct.includes('application/json')) body = await res.json();
                    else body = await res.text();
                    alert('Erro ao excluir: ' + (body.error || JSON.stringify(body) || res.statusText));
                    setStatus('Erro ao excluir.', 'error');
                }
            } catch (err) {
                console.error(err);
                alert('Erro de rede ao excluir: ' + err.message);
                setStatus('Erro de rede ao excluir.', 'error');
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
